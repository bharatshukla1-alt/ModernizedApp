<div class="card">
  <div class="card-header">
    <h2>Customer Details Modernized Screen (BNK1CCM / BNK1DCM)</h2>
  </div>
  
  <div class="search-bar">
    <input 
      type="text" 
      [(ngModel)]="searchCustNo" 
      placeholder="Enter Customer Number..." 
      class="form-control search-input"
    />
    <button class="btn btn-primary" (click)="onSearch()" [disabled]="isLoading">Search Customer</button>
  </div>

  <div *ngIf="statusMessage" [class]="isError ? 'alert alert-danger' : 'alert alert-success'">
    {{ statusMessage }}
  </div>

  <form [formGroup]="customerForm" (ngSubmit)="onSave()" class="crm-form">
    <div class="form-grid">
      <div class="form-group">
        <label>Customer Number *</label>
        <input type="text" formControlName="customerNumber" class="form-control" />
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" formControlName="title" class="form-control" placeholder="e.g. Mr/Mrs/Dr" />
      </div>

      <div class="form-group">
        <label>First Name / Christian Name *</label>
        <input type="text" formControlName="firstName" class="form-control" />
      </div>

      <div class="form-group">
        <label>Middle Initial</label>
        <input type="text" formControlName="middleInitial" class="form-control" maxlength="1" />
      </div>

      <div class="form-group">
        <label>Last Name / Surname *</label>
        <input type="text" formControlName="lastName" class="form-control" />
      </div>

      <div class="form-group full-width">
        <label>Address Line 1 *</label>
        <input type="text" formControlName="addressLine1" class="form-control" />
      </div>

      <div class="form-group full-width">
        <label>Address Line 2</label>
        <input type="text" formControlName="addressLine2" class="form-control" />
      </div>

      <div class="form-group">
        <label>City *</label>
        <input type="text" formControlName="city" class="form-control" />
      </div>

      <div class="form-group">
        <label>Post Code *</label>
        <input type="text" formControlName="postcode" class="form-control" />
      </div>

      <div class="form-group">
        <label>Country *</label>
        <input type="text" formControlName="country" class="form-control" />
      </div>

      <div class="form-group">
        <label>Date of Birth *</label>
        <input type="date" formControlName="dateOfBirth" class="form-control" />
      </div>

      <div class="form-group">
        <label>Sort Code *</label>
        <input type="text" formControlName="sortCode" class="form-control" placeholder="12-34-56" />
      </div>

      <div class="form-group">
        <label>Credit Score</label>
        <input type="number" formControlName="creditScore" class="form-control" />
      </div>

      <div class="form-group">
        <label>Score Date</label>
        <input type="date" formControlName="scoreDate" class="form-control" />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-success" [disabled]="isLoading">Save Customer</button>
      <button type="button" class="btn btn-secondary" (click)="onClear()">Clear / Reset</button>
    </div>
  </form>
</div>
